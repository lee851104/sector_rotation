[project]
name = "gics-dashboard"
version = "0.1.0"
description = "GICS sector rotation research dashboard"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<3", "httpx>=0.28,<1", "lxml>=5,<7", "PyYAML>=6,<7", "tzdata>=2025.1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/python"]
